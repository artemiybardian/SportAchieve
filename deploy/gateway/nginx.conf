server {
    listen 80;
    server_name _;

    location = /__gateway_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # api, admin, static, uploads (files), media, префикс v1 — на gunicorn :8000 внутри сети
    location ~ ^/(api|admin|files|static|media|v1)/ {
        proxy_pass         http://backend_prod:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Всё остальное → TMA (nginx SPA)
    location / {
        proxy_pass         http://frontend_prod:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
