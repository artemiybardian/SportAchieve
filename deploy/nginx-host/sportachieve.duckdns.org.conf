# Скопировать в /etc/nginx/sites-available/ и включить:
#   sudo cp deploy/nginx-host/sportachieve.duckdns.org.conf /etc/nginx/sites-available/sportachieve
#   sudo ln -sf /etc/nginx/sites-available/sportachieve /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (Let's Encrypt):
#   sudo certbot --nginx -d sportachieve.duckdns.org
# После HTTPS откройте 443 в фаерволе, иначе браузер даст ERR_TIMED_OUT:
#   sudo ufw allow 443/tcp
#
# Docker: make prod-nginx (backend :8160, PWA :3160, без Caddy).

server {
    listen 80;
    listen [::]:80;
    server_name sportachieve.duckdns.org;
    client_max_body_size 100M;

    # Обязателен хвост / или конец URI: иначе /admin попадает в SPA и уезжает на /
    location ~ ^/(api|admin|files|static|media|v1)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
