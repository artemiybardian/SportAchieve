# Telegram Web App (TWA) на отдельном поддомене (backend :8160, фронт frontend_prod :3181).
#
#   sudo cp deploy/nginx-host/sportachieve-tg.duckdns.org.conf /etc/nginx/sites-available/sportachieve-tg
#   sudo ln -sf /etc/nginx/sites-available/sportachieve-tg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt, DNS-01 через DuckDNS — как у VK):
#   export DUCKDNS_TOKEN='…'   # или token уже в /etc/letsencrypt/duckdns-credentials.ini
#   sudo -E ./scripts/certbot-tg-le-dns.sh
#
# Альтернатива HTTP-01 (если DNS резолвится снаружи):
#   sudo certbot --nginx -d sportachieve-tg.duckdns.org
#
# Docker: make prod (backend :8160, PWA :3160, VK :3162, TWA :3181).

server {
    listen 80;
    listen [::]:80;
    server_name sportachieve-tg.duckdns.org;
    client_max_body_size 100M;

    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportachieve-tg.duckdns.org;
    client_max_body_size 100M;

    # После certbot-tg-le-dns.sh:
    ssl_certificate /etc/letsencrypt/live/sportachieve-tg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportachieve-tg.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
