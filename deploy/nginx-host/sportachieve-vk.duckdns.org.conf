# VK Mini App на отдельном поддомене (тот же backend :8160, фронт vk_prod :3162).
#
#   sudo cp deploy/nginx-host/sportachieve-vk.duckdns.org.conf /etc/nginx/sites-available/sportachieve-vk
#   sudo ln -sf /etc/nginx/sites-available/sportachieve-vk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Важно: если есть только server на :80, HTTPS-провалы попадают в дефолтный SSL-vhost (часто основной домен → PWA :3160).
# Нужен отдельный listen 443 + server_name sportachieve-vk.duckdns.org → всегда :3162.
#
# Когда лимит LE позволит — выпустите сертификат с SAN sportachieve-vk и замените ssl_certificate ниже.
#
# Docker: make prod — pwa_prod :3160, vk_prod :3162.

server {
    listen 80;
    listen [::]:80;
    server_name sportachieve-vk.duckdns.org;
    client_max_body_size 100M;

    add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.vk-apps.com" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3162;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportachieve-vk.duckdns.org;
    client_max_body_size 100M;

    # Временно: те же файлы, что у основного домена (SAN может не включать vk — браузер предупредит, но upstream уже VK).
    ssl_certificate /etc/letsencrypt/live/sportachieve.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportachieve.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.vk-apps.com" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3162;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
