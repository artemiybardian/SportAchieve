# MAX Mini App на отдельном поддомене (backend :8160, фронт max_prod :3163).
#
#   sudo cp deploy/nginx-host/sportachieve-max.duckdns.org.conf /etc/nginx/sites-available/sportachieve-max
#   sudo ln -sf /etc/nginx/sites-available/sportachieve-max /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt, DNS-01 через DuckDNS — как у VK/TG):
#   export DUCKDNS_TOKEN='…'   # или token уже в /etc/letsencrypt/duckdns-credentials.ini
#   sudo -E ./scripts/certbot-max-le-dns.sh
#
# Альтернатива HTTP-01 (если DNS резолвится снаружи):
#   sudo certbot --nginx -d sportachieve-max.duckdns.org
#
# Docker: make prod — max_prod :3163.

server {
    listen 80;
    listen [::]:80;
    server_name sportachieve-max.duckdns.org;
    client_max_body_size 100M;

    add_header Content-Security-Policy "frame-ancestors 'self' https://max.ru https://*.max.ru" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3163;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportachieve-max.duckdns.org;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/sportachieve-max.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportachieve-max.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "frame-ancestors 'self' https://max.ru https://*.max.ru" always;

    location ~ ^/(api|admin|files|static|media|v1|editorjs)(/|$|\?) {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3163;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
