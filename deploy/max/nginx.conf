server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # MAX Mini App is served in a WebView from the MAX client app.
    add_header Content-Security-Policy "frame-ancestors 'self' https://max.ru https://*.max.ru" always;

    # Proxy API calls to the backend. The MAX frontend is on its own domain,
    # so this proxy provides a same-origin path for /api/* without CORS.
    location ~ ^/(api|static|files|admin|media|v1|editorjs)(/|$|\?) {
        proxy_pass         http://backend_prod:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unknown paths render index.html (MemoryRouter handles routing in-app).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
