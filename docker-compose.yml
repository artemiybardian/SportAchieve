# SportAchieve — монорепо. Запуск:
#   make dev    →  backend :8160→8000 + PWA :3160→5174 + TMA :3173→5173 + postgres :5433 + redis :6390 + celery
#   make prod   →  + Caddy :80,:443 или на хосте с nginx: make prod-nginx
#   make prod-twa →  + TMA :3181 + gateway :9190
#
# Переменные: backend-develop/.env
# БД из контейнеров: по умолчанию DB_HOST=postgres, DB_PORT=5432 (общая docker-сеть sportachieve).
# На части VPS рвётся TCP к postgres:5432 — задайте:
#   DOCKER_DB_HOST=host.docker.internal  DOCKER_DB_PORT=${DB_EXPOSED_PORT:-5433}
# (нужен compose v2 + host-gateway или FORWARD/ufw на хосте).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [dev, prod]
    environment:
      POSTGRES_USER: ${DB_USER:-sportachieve}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sportachieve_dev_secret}
      POSTGRES_DB: ${DB_NAME:-sportachieve}
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - sportachieve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [sportachieve]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [dev, prod]
    ports:
      # 6390: свободно на msk-1-vm-po98 (6379 на хосте часто занят)
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [sportachieve]

  backend:
    profiles: [dev]
    build:
      context: ./backend-develop
      dockerfile: deploy/dev/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8160:8000"
    volumes:
      - ./backend-develop:/app
    networks: [sportachieve]
    healthcheck:
      test:
        [
          "CMD",
          "/app/deploy/dev/entrypoint.sh",
          "exec-health",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready/\", timeout=5).read()",
        ]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 50s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_prod:
    profiles: [prod]
    build:
      context: ./backend-develop
      dockerfile: deploy/prod/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8160:8000"
    volumes:
      - backend_media:/app/files
    user: root
    command: ["/app/deploy/prod/start-gunicorn.sh"]
    networks: [sportachieve]
    healthcheck:
      test:
        [
          "CMD",
          "/app/deploy/prod/entrypoint.sh",
          "exec-health",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready/\", timeout=5).read()",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: [dev]
    build:
      context: ./telegram-web-app-develop
      dockerfile: deploy/dev/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
    ports:
      - "3173:5173"
    volumes:
      - ./telegram-web-app-develop:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5173/',(r)=>{process.exit((r.statusCode===200||r.statusCode===304)?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 35s
    depends_on:
      backend:
        condition: service_healthy
    networks: [sportachieve]

  celery_worker:
    profiles: [dev]
    build:
      context: ./backend-develop
      dockerfile: deploy/dev/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend-develop:/app
    networks: [sportachieve]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A main inspect ping -t 12 | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 50s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: ["celery", "-A", "main", "worker", "--loglevel", "info"]

  celery_beat:
    profiles: [dev]
    build:
      context: ./backend-develop
      dockerfile: deploy/dev/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend-develop:/app
    networks: [sportachieve]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A main inspect ping -t 12 | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 55s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    entrypoint: ["celery", "-A", "main", "beat", "--loglevel", "info"]

  celery_worker_prod:
    profiles: [prod]
    build:
      context: ./backend-develop
      dockerfile: deploy/prod/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - backend_media:/app/files
    networks: [sportachieve]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A main inspect ping -t 12 | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_prod:
        condition: service_healthy
    entrypoint: ["celery", "-A", "main", "worker", "--loglevel", "info"]

  celery_beat_prod:
    profiles: [prod]
    build:
      context: ./backend-develop
      dockerfile: deploy/prod/Dockerfile
    env_file:
      - ./backend-develop/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    networks: [sportachieve]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker_prod:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A main inspect ping -t 12 | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 20s
      retries: 4
      start_period: 70s
    entrypoint: ["celery", "-A", "main", "beat", "--loglevel", "info"]

  frontend_prod:
    profiles: [prod]
    build:
      context: ./telegram-web-app-develop
      dockerfile: deploy/docker/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
    ports:
      - "3181:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    depends_on:
      backend_prod:
        condition: service_healthy
    networks: [sportachieve]

  # HTTPS (Let's Encrypt) + один домен для PWA+API при make prod. Требует PUBLIC_DOMAIN и открытые 80/443.
  # make prod добавляет --profile caddy. Для prod-twa профиль caddy не включать (TMA через gateway :9190).
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-sportachieve.duckdns.org}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend_prod:
        condition: service_healthy
      pwa_prod:
        condition: service_healthy
    networks: [sportachieve]

  # Обновление IP в DuckDNS (опционально). Задайте DUCKDNS_TOKEN и при необходимости DUCKDNS_SUBDOMAINS.
  duckdns:
    profiles: [duckdns]
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-UTC}
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-sportachieve}
      TOKEN: ${DUCKDNS_TOKEN:-}
      LOG_FILE: "true"
    networks: [sportachieve]

  # Единый шлюз: /api/* → backend, /* → TMA. Туннелируй :9190 для Telegram (9000 часто целевой для других стеков).
  gateway:
    profiles: [prod]
    image: nginx:stable-alpine
    ports:
      - "9190:80"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/__gateway_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    depends_on:
      backend_prod:
        condition: service_healthy
      frontend_prod:
        condition: service_healthy
    networks: [sportachieve]

  pwa:
    profiles: [dev]
    build:
      context: ./apps/pwa
      dockerfile: deploy/dev/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
    ports:
      - "3160:5174"
    volumes:
      - ./apps/pwa:/app
      - pwa_node_modules:/app/node_modules
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174/ || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 35s
    depends_on:
      backend:
        condition: service_healthy
    networks: [sportachieve]

  vk:
    profiles: [dev]
    build:
      context: .
      dockerfile: deploy/vk/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8160}
        VITE_VK_APP_ID: ${VK_APP_ID:-}
    ports:
      - "3162:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks: [sportachieve]

  vk_prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: deploy/vk/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_VK_APP_ID: ${VK_APP_ID:-}
    ports:
      - "3162:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    depends_on:
      backend_prod:
        condition: service_healthy
    networks: [sportachieve]

  pwa_prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: deploy/pwa/Dockerfile
      args:
        # Empty BASE → all API calls use relative /api/... URLs, proxied by nginx above
        VITE_API_BASE_URL: ""
    ports:
      - "3160:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    depends_on:
      backend_prod:
        condition: service_healthy
    networks: [sportachieve]

networks:
  sportachieve:
    driver: bridge

volumes:
  sportachieve_pgdata:
  frontend_node_modules:
  pwa_node_modules:
  backend_media:
  caddy_data:
  caddy_config:
  vk_node_modules:
